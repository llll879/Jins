<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#e8eaef">
<title>KMBP EXCHANGE</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --bg:#e8eaef; --bg2:#f3f4f7; --card:linear-gradient(180deg,rgba(255,255,255,.92),rgba(240,241,246,.92));
  --glass:rgba(255,255,255,.62); --glass2:rgba(255,255,255,.9);
  --line:rgba(24,28,40,.09); --txt:#14171f; --dim:#6b7280; --ink:#1b1e27; --ink-t:#fff;
  --a1:#2b303b; --a2:#4a5160; --a3:#7a8190; --ok:#2f7d5b; --bad:#b4414f; --warn:#a0690a;
  --sh:0 8px 22px rgba(35,42,60,.10),0 1px 3px rgba(35,42,60,.06); --shin:inset 0 1px 0 rgba(255,255,255,.95);
  --navbg:rgba(243,244,247,.94);
  --r:20px; --ease:cubic-bezier(.2,.8,.2,1);
}
:root[data-theme="dark"]{
  --bg:#0d0f13; --bg2:#14171c; --card:linear-gradient(180deg,rgba(32,35,43,.95),rgba(24,27,33,.95));
  --glass:rgba(34,37,45,.62); --glass2:rgba(44,48,58,.9);
  --line:rgba(255,255,255,.09); --txt:#eef0f4; --dim:#9aa1b0; --ink:#eef0f4; --ink-t:#13151a;
  --a1:#d7dbe4; --a2:#aab0bd; --a3:#8a91a0; --ok:#4fb88a; --bad:#e0707e; --warn:#e0a63c;
  --sh:0 10px 26px rgba(0,0,0,.45),0 1px 2px rgba(0,0,0,.4); --shin:inset 0 1px 0 rgba(255,255,255,.06);
  --navbg:rgba(18,20,25,.94);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,sans-serif;overflow:hidden}
body{overscroll-behavior:none;background:radial-gradient(120% 60% at 80% 0%,var(--bg2),var(--bg) 70%)}
button,input,textarea{font:inherit;color:inherit}
svg.i{width:1em;height:1em;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none;display:block}
svg.i.f{fill:currentColor}

#app{position:relative;z-index:1;height:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column}
header.top{padding:calc(12px + env(safe-area-inset-top)) 16px 4px;display:flex;align-items:center;gap:10px}
body.is-home header.top{display:none}
.logo-av{width:34px;height:34px;border-radius:50%;object-fit:cover;box-shadow:var(--sh)}
.logo{font-weight:800;font-size:18px;letter-spacing:.2px}
.back{margin-left:auto;display:none}
.iconbtn{width:46px;height:46px;border-radius:15px;border:1px solid var(--line);background:var(--card);box-shadow:var(--sh),var(--shin);display:grid;place-items:center;font-size:23px;cursor:pointer;color:var(--ink);transition:transform .2s var(--ease)}
.iconbtn:active{transform:scale(.92)}
#main{flex:1;overflow-y:auto;overflow-x:hidden;padding:8px 16px 110px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
#main::-webkit-scrollbar{display:none}
.view{animation:viewIn .45s var(--ease) both}
.view.leave{animation:viewOut .15s ease-in both}
@keyframes viewIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes viewOut{to{opacity:0;transform:translateY(-6px)}}
.stagger>*{opacity:0;animation:rise .5s var(--ease) both;animation-delay:calc(var(--i,0)*55ms + 40ms)}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}

h2.page{margin:6px 2px 14px;font-size:24px;font-weight:800;letter-spacing:.1px}
.sub{color:var(--dim);font-size:14px;margin:-8px 2px 14px;line-height:1.4}
.grad{color:var(--txt)}
.glass{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh),var(--shin)}
.card{padding:16px;margin-bottom:12px}
.rich{white-space:pre-wrap;word-break:break-word;line-height:1.5;font-size:15px}
.rich a{color:var(--a2);text-decoration:underline} .rich code{background:var(--line);padding:1px 5px;border-radius:6px}
.rich blockquote{margin:6px 0;padding-left:10px;border-left:3px solid var(--a3);color:var(--dim)}
.welcome-img{width:100%;border-radius:14px;margin-bottom:12px;display:block;max-height:240px;object-fit:cover}

/* ===== home hero ===== */
.homewrap{position:relative}
.statue{position:absolute;right:-10px;top:-4px;width:50%;max-width:250px;z-index:0;pointer-events:none;opacity:.96;
  -webkit-mask-image:linear-gradient(#000 62%,transparent);mask-image:linear-gradient(#000 62%,transparent);
  filter:drop-shadow(0 10px 24px rgba(30,36,52,.18))}
:root[data-theme="dark"] .statue{opacity:.8;filter:brightness(.82) drop-shadow(0 10px 24px rgba(0,0,0,.5))}
.hero{position:relative;z-index:1;display:flex;align-items:center;gap:14px;padding:calc(10px + env(safe-area-inset-top)) 0 14px}
.hero .av{width:62px;height:62px;border-radius:50%;object-fit:cover;box-shadow:var(--sh);border:2px solid rgba(255,255,255,.7);flex:none}
.hero .ht{min-width:0;flex:1}
.hero h1{margin:0;font-size:24px;white-space:nowrap;font-weight:800;letter-spacing:.2px;line-height:1.1;text-shadow:0 1px 0 rgba(255,255,255,.5)}
:root[data-theme="dark"] .hero h1{text-shadow:none}
.hero p{margin:4px 0 0;font-size:11.5px;color:var(--dim);white-space:nowrap}
.hero .btns{display:flex;gap:10px;align-self:flex-start}
.hero .iconbtn{width:42px;height:42px;font-size:21px;border-radius:13px;background:var(--glass2);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.hero .row2{display:flex;align-items:center;gap:14px;width:100%}
.hero-top{position:relative;z-index:1}
.hero-top .bar{display:flex;justify-content:flex-end;gap:10px;padding-top:calc(6px + env(safe-area-inset-top))}
.hero-top .id{display:flex;align-items:center;gap:14px;margin-top:2px}
.searchbar{position:relative;z-index:1;display:flex;align-items:center;gap:12px;height:52px;padding:0 16px;border-radius:18px;background:var(--glass);border:1px solid var(--line);box-shadow:var(--sh),var(--shin);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);color:var(--dim);font-size:16px;cursor:pointer;margin:6px 0 14px}
.searchbar .i{font-size:23px;color:var(--ink)}
.searchbar span{flex:1}
.searchbar .fl{font-size:25px;color:var(--a2);padding:6px;margin:-6px}

.tiles{position:relative;z-index:1;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.tile{position:relative;display:flex;align-items:center;gap:8px;padding:12px 10px;min-width:0;min-height:64px;text-align:left;cursor:pointer;border:1px solid var(--line);border-radius:var(--r);background:var(--glass);box-shadow:var(--sh),var(--shin);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);transition:transform .2s var(--ease)}
.tile:active{transform:scale(.97)}
.tile .in{display:none}
.tile .ic{font-size:26px;color:var(--ink);flex:none;filter:drop-shadow(0 3px 3px rgba(30,36,52,.25))}
.tile .tx{flex:1;min-width:0}
.tile b{display:block;font-size:12.5px;font-weight:600;line-height:1.25;overflow-wrap:break-word;hyphens:none}
.tile small{color:var(--dim);font-size:12px;line-height:1.3;display:block;margin-top:2px}
.tile .chev{color:var(--a3);font-size:14px}
.tile .cnt{min-width:28px;height:26px;padding:0 7px;border-radius:99px;display:grid;place-items:center;font-weight:700;font-size:14px;background:var(--line)}
.tile.wide{grid-column:1/-1}
.tile.col{flex-direction:column;align-items:flex-start;justify-content:center;min-height:104px;gap:6px}
.tile.col .ic{font-size:28px}
.badge{position:absolute;top:10px;right:10px;z-index:2;background:var(--ink);color:var(--ink-t);border-radius:99px;font-size:11px;font-weight:700;padding:2px 8px}

.sec{position:relative;z-index:1;display:flex;align-items:center;justify-content:space-between;margin:22px 2px 12px}
.sec h3{margin:0;display:flex;align-items:center;gap:8px;font-size:17px;min-width:0;font-weight:800;white-space:nowrap}
.sec h3 .i{font-size:22px}
.sec a{display:flex;align-items:center;gap:6px;color:var(--dim);font-size:13px;cursor:pointer;white-space:nowrap}
.sec a .i{font-size:18px;color:var(--ink)}
.pcard{position:relative;z-index:1;display:flex;gap:14px;padding:12px;margin-bottom:12px;cursor:pointer;transition:transform .2s var(--ease)}
.pcard:active{transform:scale(.98)}
.pimg{position:relative;width:118px;height:112px;flex:none;border-radius:14px;background-size:cover;background-position:center;box-shadow:inset 0 0 0 1px rgba(255,255,255,.4)}
.pill{position:absolute;left:6px;top:6px;display:flex;align-items:center;gap:6px;padding:3px 9px 3px 7px;border-radius:99px;background:rgba(40,42,50,.62);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);color:#fff;font-size:11px;font-weight:600}
.pill i{width:8px;height:8px;border-radius:50%;background:#7cc4ff;box-shadow:0 0 6px #7cc4ff}
.pbody{flex:1;min-width:0;display:flex;flex-direction:column}
.ptop{display:flex;gap:8px;align-items:flex-start}
.ptitle{flex:1;font-size:16px;font-weight:500;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.heart{width:32px;height:32px;margin:-4px -4px 0 0;border:0;background:none;color:var(--a2);font-size:24px;display:grid;place-items:center;cursor:pointer;flex:none}
.heart.on{color:var(--bad)}
.pprice{font-size:21px;font-weight:800;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pprice.t{font-size:14px;font-weight:600;color:var(--dim);margin-top:6px}
.pfoot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:auto;padding-top:6px}
.pclock{display:flex;align-items:center;gap:6px;color:var(--dim);font-size:13px;min-width:0;overflow:hidden;white-space:nowrap}
.pclock .i{font-size:16px}
.pclock span{overflow:hidden;text-overflow:ellipsis}
.pbtn{display:flex;align-items:center;gap:7px;height:36px;padding:0 14px;border-radius:99px;border:1px solid var(--line);background:var(--glass2);box-shadow:var(--sh),var(--shin);font-weight:600;font-size:13px;cursor:pointer;color:var(--txt);flex:none}
.pbtn .i{font-size:17px}
.stats{position:relative;z-index:1;padding:14px 8px 12px;margin:4px 0 12px;cursor:pointer}
.stats .sh{display:flex;align-items:center;gap:10px;padding:0 10px 10px;font-weight:700;font-size:15px}
.stats .sh small{font-weight:400;color:var(--dim);font-size:14px}
.stats .sh .i{font-size:22px}
.stats .sh .go{margin-left:auto;color:var(--dim);font-size:20px}
.stats .cols{display:grid;grid-template-columns:repeat(4,1fr)}
.stats .col{text-align:center;padding:2px 2px;border-left:1px solid var(--line)}
.stats .col:first-child{border:0}
.stats .col .i{font-size:26px;margin:0 auto 4px;color:var(--ink)}
.stats .col b{display:block;font-size:19px;font-weight:700}
.stats .col span{font-size:12px;color:var(--dim)}

/* ===== buttons / inputs ===== */
.btn{position:relative;overflow:hidden;border:0;cursor:pointer;padding:13px 20px;border-radius:14px;font-weight:700;font-size:15px;color:var(--ink-t);background:linear-gradient(180deg,#3a3f4b,#171a21);box-shadow:0 8px 18px rgba(25,30,45,.28),inset 0 1px 0 rgba(255,255,255,.18);transition:transform .2s var(--ease),opacity .2s}
:root[data-theme="dark"] .btn{background:linear-gradient(180deg,#f4f5f8,#c9cdd6);color:#12141a;box-shadow:0 8px 18px rgba(0,0,0,.4)}
.btn:active{transform:scale(.95)}
.btn:disabled{opacity:.45;pointer-events:none}
.btn.ghost{background:var(--glass2);color:var(--txt);box-shadow:var(--sh),var(--shin);border:1px solid var(--line)}
:root[data-theme="dark"] .btn.ghost{background:var(--glass2);color:var(--txt)}
.btn.ok{background:linear-gradient(180deg,#3d9b74,#2a7154);color:#fff;box-shadow:0 8px 18px rgba(47,125,91,.28)}
.btn.bad{background:linear-gradient(180deg,#cc5666,#a23b49);color:#fff;box-shadow:0 8px 18px rgba(180,65,79,.28)}
:root[data-theme="dark"] .btn.ok,:root[data-theme="dark"] .btn.bad{color:#fff}
.btn.small{padding:8px 13px;font-size:13px;border-radius:11px}
.btn.block{display:block;width:100%}
.ripple{position:absolute;border-radius:50%;background:rgba(255,255,255,.35);transform:scale(0);animation:rip .6s ease-out forwards;pointer-events:none}
@keyframes rip{to{transform:scale(4);opacity:0}}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.end{justify-content:flex-end}
.grow{flex:1}
input.f,textarea.f{width:100%;padding:14px 16px;border-radius:14px;background:var(--glass2);border:1px solid var(--line);outline:none;font-size:16px;transition:border-color .25s,box-shadow .25s;resize:vertical;box-shadow:inset 0 2px 4px rgba(30,36,52,.06)}
textarea.f{min-height:130px}
input.f:focus,textarea.f:focus{border-color:var(--a2);box-shadow:0 0 0 4px rgba(90,98,115,.16)}
.lbl{font-size:13px;color:var(--dim);margin:12px 2px 6px;display:block}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:99px;background:var(--glass2);border:1px solid var(--line);font-size:13px;cursor:pointer;user-select:none;box-shadow:var(--sh),var(--shin);transition:all .2s var(--ease)}
.chip.dim{color:var(--dim);cursor:default;box-shadow:none}
.chip.sel{background:var(--ink);color:var(--ink-t);border-color:transparent}
.chip .n{opacity:.6;font-size:12px}
.counter{font-size:12px;color:var(--dim);text-align:right;margin-top:4px}

/* ===== feed ===== */
.feed-head{display:flex;align-items:center;justify-content:space-between;margin:2px 2px 12px}
.feed-title{font-weight:800;font-size:17px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pos{font-size:13px;color:var(--dim);font-variant-numeric:tabular-nums}
.stage{position:relative;min-height:320px;touch-action:pan-y}
.post{padding:18px;animation:cardIn .4s var(--ease) both;will-change:transform}
.post.l{animation-name:cardInL}
@keyframes cardIn{from{opacity:0;transform:translateX(50px) scale(.97)}to{opacity:1;transform:none}}
@keyframes cardInL{from{opacity:0;transform:translateX(-50px) scale(.97)}to{opacity:1;transform:none}}
.post .body{margin:14px 0;max-height:46vh;overflow-y:auto;scrollbar-width:none;font-size:16px}
.post .foot{display:flex;align-items:center;gap:8px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:12px}
.author{color:var(--dim);font-size:13px;margin-right:auto}
.feed-nav{display:flex;gap:10px;margin-top:14px}
.feed-nav .btn{flex:1}
.end{text-align:center;padding:34px 20px}
.end .big{font-size:54px}
.empty{text-align:center;color:var(--dim);padding:40px 10px}
.empty .big{font-size:48px;margin-bottom:8px;filter:grayscale(1)}
.note{font-size:13px;color:var(--warn);background:rgba(160,105,10,.08);border:1px solid rgba(160,105,10,.25);border-radius:12px;padding:8px 12px;margin-bottom:10px}
.post-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}
.post-actions .btn{flex:1;min-width:112px}
.post-meta{font-size:12px;color:var(--dim);margin-top:8px}

.status{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:700}
.st-pending,.st-awaiting_reason,.st-awaiting_edit{background:rgba(160,105,10,.13);color:var(--warn)}
.st-approved,.st-approved_edited,.st-accepted{background:rgba(47,125,91,.13);color:var(--ok)}
.st-rejected,.st-declined_by_user{background:rgba(180,65,79,.13);color:var(--bad)}
.st-awaiting_user{background:var(--line);color:var(--a2)}
.li{display:flex;align-items:center;gap:12px;padding:14px;margin-bottom:10px;cursor:pointer;transition:transform .2s var(--ease)}
.li:active{transform:scale(.97)}
.li .ic{font-size:22px;width:34px;text-align:center;filter:grayscale(1)}
.li .t{flex:1;min-width:0}.li .t b{display:block}.li .t small{color:var(--dim)}
.li .arr{color:var(--dim);font-size:20px}
.kv{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.kv:last-child{border:0}.kv span:first-child{color:var(--dim)}

/* ===== nav ===== */
nav.bar{position:fixed;left:0;right:0;bottom:0;z-index:10;display:flex;max-width:560px;margin:0 auto;padding:6px 6px calc(8px + env(safe-area-inset-bottom));background:var(--navbg);border-top:1px solid var(--line);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 -8px 24px rgba(30,36,52,.06)}
nav.bar button{flex:1;position:relative;z-index:1;background:none;border:0;padding:10px 0 4px;color:var(--dim);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:13px;transition:color .25s}
nav.bar button .e{font-size:28px}
nav.bar button.on{color:var(--txt);font-weight:600}
#ind{position:absolute;top:-1px;left:6px;width:calc((100% - 12px)/4);height:3px;display:flex;justify-content:center;transition:transform .4s var(--ease);z-index:0}
#ind::after{content:"";width:62%;height:3px;border-radius:0 0 3px 3px;background:var(--ink)}

/* ===== misc ===== */
.loader{display:flex;justify-content:center;padding:60px 0}
.orb{position:relative;width:46px;height:46px}
.orb i{position:absolute;inset:0;border-radius:50%;border:2.5px solid transparent;border-top-color:var(--ink);animation:spin 1s linear infinite}
.orb i:nth-child(2){inset:8px;border-top-color:var(--a3);animation-duration:1.5s;animation-direction:reverse}
.orb i:nth-child(3){display:none}
@keyframes spin{to{transform:rotate(360deg)}}
#toast{position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top));transform:translate(-50%,-140%);z-index:50;max-width:88vw;padding:12px 18px;border-radius:16px;background:var(--glass2);border:1px solid var(--line);backdrop-filter:blur(16px);font-size:14px;transition:transform .45s var(--ease);box-shadow:var(--sh)}
#toast.show{transform:translate(-50%,0)}#toast.err{border-color:rgba(180,65,79,.6)}#toast.good{border-color:rgba(47,125,91,.6)}
.shake{animation:shake .45s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.sw{position:relative;width:52px;height:30px;border-radius:99px;background:var(--line);cursor:pointer;transition:background .3s;flex:none;box-shadow:inset 0 2px 4px rgba(0,0,0,.12)}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.3);transition:transform .3s var(--ease)}
.sw.on{background:var(--ink)}.sw.on::after{transform:translateX(22px);background:var(--ink-t)}
details.card summary{cursor:pointer;font-weight:700;list-style:none}details.card summary::-webkit-details-marker{display:none}
hr.sep{border:0;border-top:1px solid var(--line);margin:12px 0}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

/* --- картинки объявлений --- */
.ad-img{display:block;width:100%;max-height:300px;object-fit:cover;border-radius:14px;margin:12px 0 0;background:var(--line)}
.upl{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.upl .thumb{width:84px;height:84px;border-radius:14px;object-fit:cover;box-shadow:var(--sh);background:var(--line)}
.req-img{display:block;width:100%;max-height:220px;object-fit:cover;border-radius:12px;margin:8px 0}
.pe-wrap{display:contents}
.pe{display:inline-block;width:1.3em;height:1.3em;vertical-align:-.28em;line-height:1.3em;overflow:hidden;text-align:center}
.pe img,.pe video,.pe .pe-l{display:block;width:100%;height:100%;object-fit:contain}
</style>
</head>
<body>
<div id="toast"></div>
<div id="app">
  <header class="top"><img class="logo-av" id="logoAv" alt=""><span class="logo">KMBP EXCHANGE</span><button class="btn ghost small back" id="backBtn">← Назад</button></header>
  <main id="main"></main>
  <nav class="bar" id="nav">
    <div id="ind"></div>
    <button data-go="home"><span class="e" data-i="home"></span>Главная</button>
    <button data-go="favorites"><span class="e" data-i="heart"></span>Избранное</button>
    <button data-go="submit"><span class="e" data-i="plus"></span>Создать</button>
    <button data-go="more"><span class="e" data-i="user"></span>Профиль</button>
  </nav>
</div>

<script>

// безопасный рендер Telegram-HTML (tg-emoji → обычный эмодзи-заменитель)
function safe(src, noWrap) {
  src = src || '';
  const hasPE = !noWrap && /<tg-emoji/i.test(src);
  const doc = new DOMParser().parseFromString('<div>' + (src || '') + '</div>', 'text/html');
  const out = document.createElement('div');
  const OK = ['b', 'strong', 'i', 'em', 'u', 's', 'strike', 'del', 'code', 'pre', 'blockquote'];
  (function walk(from, to) {
    from.childNodes.forEach(n => {
      if (n.nodeType === 3) to.appendChild(document.createTextNode(n.textContent));
      else if (n.nodeType === 1) {
        const t = n.tagName.toLowerCase();
        if (t === 'br') to.appendChild(document.createElement('br'));
        else if (t === 'tg-emoji') {
          const e = document.createElement('span'); e.className = 'pe';
          const id = (n.getAttribute('emoji-id') || '').replace(/\D/g, '');
          if (id) e.dataset.id = id;
          e.textContent = n.textContent; to.appendChild(e);
        }
        else if (OK.includes(t)) { const e = document.createElement(t); walk(n, e); to.appendChild(e); }
        else if (t === 'a') {
          const e = document.createElement('a'); const h = n.getAttribute('href') || '';
          if (/^(https?:\/\/|tg:\/\/)/i.test(h)) { e.href = h; e.target = '_blank'; e.rel = 'noopener'; }
          walk(n, e); to.appendChild(e);
        } else walk(n, to);
      }
    });
  })(doc.body.firstChild, out);
  if (hasPE) return `<div class="pe-wrap" data-k="${peKey(src)}">${out.innerHTML}</div>`;
  return out.innerHTML;
}

// ---- премиум-эмодзи: показываем настоящие стикеры; если не вышло — ИИ делает текст без них
const PE = { raw: new Map(), keys: new Map(), cache: new Map(), lottie: null };
function peKey(src) {
  if (!PE.keys.has(src)) { const k = String(PE.raw.size); PE.raw.set(k, src); PE.keys.set(src, k); }
  return PE.keys.get(src);
}
function peLottie() {
  return PE.lottie || (PE.lottie = new Promise((res, rej) => {
    if (window.lottie) return res(window.lottie);
    const sc = document.createElement('script');
    sc.src = 'https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie_light.min.js';
    sc.onload = () => window.lottie ? res(window.lottie) : rej(new Error('lottie'));
    sc.onerror = () => rej(new Error('lottie'));
    document.head.appendChild(sc);
  }).catch(e => { PE.lottie = null; throw e; }));
}
function peLoad(id) {
  if (PE.cache.has(id)) return PE.cache.get(id);
  const p = (async () => {
    const r = await fetch('/api/emoji/' + id, { headers: { 'X-Init-Data': (tg && tg.initData) || '' } });
    if (!r.ok) throw new Error('emoji');
    const fmt = r.headers.get('X-Emoji-Fmt') || 'webp';
    if (fmt === 'tgs') {
      if (!window.DecompressionStream) throw new Error('no-gzip');
      const lib = await peLottie();
      const json = JSON.parse(await new Response(r.body.pipeThrough(new DecompressionStream('gzip'))).text());
      return { fmt, json, lib };
    }
    return { fmt, url: URL.createObjectURL(await r.blob()) };
  })();
  PE.cache.set(id, p); p.catch(() => PE.cache.delete(id));
  return p;
}
function peMount(el, d) {
  el.textContent = '';
  if (d.fmt === 'webm') {
    const v = document.createElement('video'); v.src = d.url; v.loop = true; v.muted = true; v.autoplay = true; v.playsInline = true;
    v.setAttribute('playsinline', ''); el.appendChild(v); v.play && v.play().catch(() => {});
  } else if (d.fmt === 'tgs') {
    const box = document.createElement('span'); box.className = 'pe-l'; el.appendChild(box);
    d.lib.loadAnimation({ container: box, renderer: 'svg', loop: true, autoplay: true, animationData: JSON.parse(JSON.stringify(d.json)) });
  } else { const i = new Image(); i.alt = ''; i.src = d.url; el.appendChild(i); }
}
async function peHydrate(wrap) {
  if (wrap.dataset.h) return; wrap.dataset.h = '1';
  const els = $$('.pe[data-id]', wrap);
  const ok = await Promise.all(els.map(async el => { try { peMount(el, await peLoad(el.dataset.id)); return true; } catch (e) { return false; } }));
  if (ok.every(Boolean)) return;                       // стикеры показались — оставляем как есть
  const raw = PE.raw.get(wrap.dataset.k);              // не показались — ИИ убирает их и дописывает буквы красивым шрифтом
  try { const d = await api('/api/clean', { text: raw }); wrap.innerHTML = safe(d.text, true); } catch (e) { wrap.innerHTML = safe(raw.replace(/<tg-emoji[^>]*>(.*?)<\/tg-emoji>/gs, '$1'), true); }
}
new MutationObserver(ms => ms.forEach(m => m.addedNodes.forEach(n => {
  if (n.nodeType !== 1) return;
  if (n.matches && n.matches('.pe-wrap')) peHydrate(n);
  n.querySelectorAll && n.querySelectorAll('.pe-wrap:not([data-h])').forEach(peHydrate);
}))).observe(document.documentElement, { childList: true, subtree: true });
// уменьшаем фото перед отправкой (до 1600px, JPEG) — быстрее грузится и всегда принимается
function shrinkImage(file, max = 1600, q = 0.85) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height));
      const w = Math.max(1, Math.round(img.width * k)), h = Math.max(1, Math.round(img.height * k));
      const c = document.createElement('canvas'); c.width = w; c.height = h;
      const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, w, h); x.drawImage(img, 0, 0, w, h);
      c.toBlob(b => { URL.revokeObjectURL(url); b ? res(b) : rej(Object.assign(new Error('bad_image'), { code: 'bad_image' })); }, 'image/jpeg', q);
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(Object.assign(new Error('bad_image'), { code: 'bad_image' })); };
    img.src = url;
  });
}
const plain = src => new DOMParser().parseFromString(safe(src, true).replace(/<br\s*\/?>/g, '\n'), 'text/html').body.textContent;

async function api(path, body, method) {
  const opt = { method: method || (body === undefined ? 'GET' : 'POST'), headers: { 'X-Init-Data': (tg && tg.initData) || '' } };
  if (body instanceof FormData) opt.body = body;
  else if (body !== undefined) { opt.headers['Content-Type'] = 'application/json'; opt.body = JSON.stringify(body); }
  let r;
  try { r = await fetch(path, opt); } catch (e) { const er = new Error('network'); er.code = 'network'; throw er; }
  let data = null; try { data = await r.json(); } catch (e) {}
  if (!r.ok) { const er = new Error((data && data.error) || 'http' + r.status); er.code = er.message; er.status = r.status; throw er; }
  return data;
}

function Feed(el, o) {
  let items = o.items.slice(), more = o.hasMore, idx = 0, busy = false, dragging = false;
  el.innerHTML = `<div class="feed-head"><div class="feed-title">${o.title}</div><div class="pos"></div></div>
    ${o.note ? `<div class="note">${esc(o.note)}</div>` : ''}
    <div class="stage"></div>
    <div class="feed-nav"><button class="btn ghost prev">← Назад</button><button class="btn next">Далее →</button></div>`;
  const stage = $('.stage', el), pos = $('.pos', el);
  async function ensure() { if (more && !busy && idx >= items.length - 3) { busy = true; try { const d = await o.more(); items = items.concat(d.posts); more = d.has_more; } catch (e) { more = false; } busy = false; render(); } }
  function show(dir) {
    stage.innerHTML = '';
    if (idx >= items.length) {
      stage.innerHTML = `<div class="post glass end ${dir < 0 ? 'l' : ''}"><div class="big">🎉</div><p>${esc(S.me.texts.feed_end.replace(/<[^>]+>/g, ''))}</p><button class="btn restart">↺ К началу</button></div>`;
      $('.restart', stage).onclick = () => { idx = 0; show(-1); render(); }; return;
    }
    const p = items[idx];
    const card = document.createElement('article'); card.className = 'post glass' + (dir < 0 ? ' l' : '');
    card.innerHTML = `<div class="chips"><span class="chip dim">📂 ${esc(p.topic)}</span><span class="chip dim">🕒 ${esc(p.created)}</span></div>
      ${p.photo ? `<img class="ad-img" src="${esc(p.photo)}" alt="" loading="lazy">` : ''}
      <div class="body rich">${safe(p.text)}</div>
      <div class="foot"><span class="author">Автор: ${esc(p.author)}</span>
      ${p.author_url ? '<button class="btn small contact">Профиль автора</button>' : ''}
      ${isStaff() ? '<button class="btn small bad del">Удалить</button>' : ''}</div>
      <div class="post-actions">
        <button class="btn ghost small fav">☆ В избранное</button>
        <button class="btn ghost small report">Пожаловаться</button>
        ${p.mine ? '<button class="btn ok small bump">Поднять</button>' : ''}
      </div>
      ${p.expires ? `<div class="post-meta">Действует до ${esc(p.expires)}</div>` : ''}`;
    stage.appendChild(card);
    const c = $('.contact', card); if (c) c.onclick = () => openLink(p.author_url || p.contact);
    const f = $('.fav', card); if (f) f.onclick = async () => { try { const r=await api('/api/favorite',{post_id:p.id}); f.textContent=r.saved?'★ В избранном':'☆ В избранное'; f.classList.toggle('ok',r.saved); toast(r.saved?'Добавлено в избранное':'Убрано из избранного','good'); } catch(e){fail(e)} };
    const rp = $('.report', card); if (rp) rp.onclick = async () => { if(!await confirmBox('Отправить жалобу на это объявление?')) return; try{const r=await api('/api/report',{post_id:p.id});toast(r.duplicate?'Вы уже жаловались':'Жалоба отправлена админам','good')}catch(e){fail(e)} };
    const bp = $('.bump', card); if (bp) bp.onclick = async () => { try{await api('/api/bump',{post_id:p.id});toast('Объявление поднято ещё на 30 дней','good');go(S.cur,S.curParams,{replace:true})}catch(e){fail(e)} };
    const d = $('.del', card); if (d) d.onclick = async () => { if (!await confirmBox('Удалить объявление?')) return; await api('/api/admin/post_del', { id: p.id }); items.splice(idx, 1); toast('Удалено', 'good'); show(1); render(); };
    api('/api/view', { post_id: p.id }).catch(() => {});
  }
  function render() { pos.textContent = items.length ? `${Math.min(idx + 1, items.length)} / ${items.length}${more ? '+' : ''}` : ''; $('.prev', el).style.visibility = idx === 0 ? 'hidden' : 'visible'; $('.next', el).disabled = idx >= items.length && !more; }
  function step(d) { const n = idx + d; if (n < 0 || n > items.length) return; idx = n; show(d); render(); ensure(); buzz('light'); }
  $('.next', el).onclick = () => step(1); $('.prev', el).onclick = () => step(-1);
  // свайп
  let sx = 0, sy = 0, dx = 0, lock = null;
  stage.addEventListener('pointerdown', e => { if (e.target.closest('button,a')) return; sx = e.clientX; sy = e.clientY; dx = 0; lock = null; dragging = true; });
  stage.addEventListener('pointermove', e => {
    if (!dragging) return; const c = $('.post', stage); if (!c) return;
    const mx = e.clientX - sx, my = e.clientY - sy;
    if (lock === null && (Math.abs(mx) > 8 || Math.abs(my) > 8)) lock = Math.abs(mx) > Math.abs(my) ? 'x' : 'y';
    if (lock !== 'x') return; dx = mx; c.style.animation = 'none'; c.style.transition = 'none'; c.style.transform = `translateX(${dx}px) rotate(${dx / 25}deg)`; c.style.opacity = 1 - Math.min(Math.abs(dx) / 400, .5);
  });
  const end = () => { if (!dragging) return; dragging = false; const c = $('.post', stage); if (lock === 'x' && c) { if (Math.abs(dx) > 90) { const d = dx < 0 ? 1 : -1; c.style.transition = 'transform .22s,opacity .22s'; c.style.transform = `translateX(${dx < 0 ? -420 : 420}px) rotate(${dx < 0 ? -14 : 14}deg)`; c.style.opacity = 0; setTimeout(() => step(d), 180); } else { c.style.transition = 'transform .3s var(--ease),opacity .3s'; c.style.transform = ''; c.style.opacity = 1; } } };
  stage.addEventListener('pointerup', end); stage.addEventListener('pointercancel', end);
  show(1); render(); ensure();
}

  el.innerHTML = `<h2 class="page">📂 Темы</h2><p class="sub">✅ — привязана к теме чата (посты дублируются в чат, команда /bind). ⚠️ — только каталог бота.</p>
    <div class="card glass"><div class="row"><input class="f grow" id="nt" maxlength="60" placeholder="Новая тема"><button class="btn small" id="add">➕</button></div></div>
    <div class="stagger">${d.topics.map(t => `<div class="li glass" data-id="${t.id}"><span class="ic">${t.bound ? '✅' : '⚠️'}</span><span class="t"><b>${esc(t.name)}</b><small>объявлений: ${t.count}</small></span><button class="btn bad small del">🗑</button></div>`).join('')}</div>`;
  $('#add', el).onclick = async () => { const n = $('#nt', el).value.trim(); if (!n) return; try { await api('/api/admin/topic_add', { name: n }); toast('Тема добавлена ✅', 'good'); go('admin_topics', {}, { replace: true }); } catch (e) { fail(e); } };
  $$('.li', el).forEach(r => $('.del', r).onclick = async ev => { ev.stopPropagation(); if (!await confirmBox('Удалить тему?')) return; await api('/api/admin/topic_del', { id: +r.dataset.id }); toast('Удалено', 'good'); go('admin_topics', {}, { replace: true }); });
};

views.admin_admins = async el => {
  const d = await api('/api/admin/admins');
  el.innerHTML = `<h2 class="page">👮 Админы</h2>
    <div class="li glass" style="cursor:default"><span class="ic">👑</span><span class="t"><b>Владелец</b><small>${d.owner_id}</small></span></div>
    <div class="stagger">${d.admins.map(a => `<div class="li glass" data-id="${a.user_id}" style="cursor:default"><span class="ic">${a.role === 'main' ? '⭐' : '🛡'}</span><span class="t"><b>${esc(a.label || a.user_id)}</b><small>${a.role === 'main' ? 'главный' : 'младший'} · ${a.user_id}</small></span>${(d.is_owner || a.role === 'junior') ? '<button class="btn bad small del">🗑</button>' : ''}</div>`).join('')}</div>
    <div class="card glass"><span class="lbl" style="margin-top:0">Добавить по числовому ID (узнать — @userinfobot)</span><input class="f" id="uid" inputmode="numeric" placeholder="123456789"><div class="row" style="margin-top:10px"><button class="btn small grow" id="aj">➕ Младший</button>${d.is_owner ? '<button class="btn ghost small grow" id="am">➕ Главный</button>' : ''}</div></div>`;
  const add = async role => { const v = $('#uid', el).value.trim(); if (!v) return; try { await api('/api/admin/admin_add', { user_id: v, role }); toast('Готово ✅', 'good'); go('admin_admins', {}, { replace: true }); } catch (e) { fail(e); } };
  $('#aj', el).onclick = () => add('junior'); const am = $('#am', el); if (am) am.onclick = () => add('main');
  $$('.li[data-id]', el).forEach(r => { const b = $('.del', r); if (b) b.onclick = async () => { if (!await confirmBox('Убрать админа?')) return; try { await api('/api/admin/admin_del', { user_id: +r.dataset.id }); toast('Удалён', 'good'); go('admin_admins', {}, { replace: true }); } catch (e) { fail(e); } }; });
};

views.admin_subs = async el => {
  const d = await api('/api/admin/subs');
  el.innerHTML = `<h2 class="page">🔔 Обязательная подписка</h2><p class="sub">${d.subs.length ? '' : 'Список пуст — проверка выключена. '}Бот должен быть админом в канале (в группе достаточно участника).</p>
    <div class="stagger">${d.subs.map(s => `<div class="li glass" data-id="${s.id}" style="cursor:default"><span class="ic">📢</span><span class="t"><b>${esc(s.title)}</b><small>${esc(s.link)}</small></span><button class="btn bad small del">🗑</button></div>`).join('')}</div>
    <div class="card glass"><span class="lbl" style="margin-top:0">@username, ссылка t.me/… или ID чата</span><div class="row"><input class="f grow" id="ref" placeholder="@my_channel"><button class="btn small" id="add">➕</button></div></div>`;
  $('#add', el).onclick = async e => { const v = $('#ref', el).value.trim(); if (!v) return; e.currentTarget.disabled = true; try { const r = await api('/api/admin/sub_add', { ref: v }); if (r.ok) { toast('Добавлено: ' + r.msg, 'good'); go('admin_subs', {}, { replace: true }); } else { toast(r.msg, 'err'); e.currentTarget.disabled = false; } } catch (er) { e.currentTarget.disabled = false; fail(er); } };
  $$('.li[data-id]', el).forEach(r => $('.del', r).onclick = async () => { await api('/api/admin/sub_del', { id: +r.dataset.id }); toast('Удалено', 'good'); go('admin_subs', {}, { replace: true }); });
};

views.admin_recruit = async el => {
  const [o, q] = await Promise.all([api('/api/admin/overview'), api('/api/admin/questions')]);
  el.innerHTML = `<h2 class="page">🙋 Набор в админы</h2>
    <div class="card glass"><div class="row"><span class="grow"><b>Набор ${o.recruit_open ? 'открыт' : 'закрыт'}</b><br><small style="color:var(--dim)">Кнопка «Хочу стать админом» ${o.recruit_open ? 'видна' : 'скрыта'} у пользователей (в боте — после /start)</small></span><div class="sw ${o.recruit_open ? 'on' : ''}" id="sw"></div></div></div>
    <h2 class="page" style="font-size:18px">Вопросы анкеты</h2>
    <div class="stagger">${q.questions.length ? q.questions.map((x, i) => `<div class="li glass" data-id="${x.id}" style="cursor:default"><span class="ic">${i + 1}</span><span class="t"><b>${esc(x.text)}</b></span><button class="btn bad small del">🗑</button></div>`).join('') : `<p class="sub">Своих вопросов нет — используется: «${esc(q.default)}»</p>`}</div>
    <div class="card glass"><div class="row"><input class="f grow" id="nq" maxlength="100" placeholder="Новый вопрос (до 6 всего)"><button class="btn small" id="add">➕</button></div></div>`;
  $('#sw', el).onclick = async () => { await api('/api/admin/recruit', { open: !o.recruit_open }); toast(!o.recruit_open ? 'Набор открыт 🔓' : 'Набор закрыт 🔒', 'good'); go('admin_recruit', {}, { replace: true }); };
  $('#add', el).onclick = async () => { const v = $('#nq', el).value.trim(); if (!v) return; try { await api('/api/admin/question_add', { text: v }); go('admin_recruit', {}, { replace: true }); } catch (e) { fail(e); } };
  $$('.li[data-id]', el).forEach(r => $('.del', r).onclick = async () => { await api('/api/admin/question_del', { id: +r.dataset.id }); go('admin_recruit', {}, { replace: true }); });
};

views.admin_pic = async el => {
  const o = await api('/api/admin/overview');
  el.innerHTML = `<h2 class="page">🖼 Картинка приветствия</h2><div class="card glass stagger"><p class="sub" style="margin-top:0">Сейчас: ${o.has_photo ? 'есть ✅' : 'нет'}</p>
    <input type="file" id="file" accept="image/*" hidden><button class="btn block" id="up">📤 Загрузить / заменить</button>${o.has_photo ? '<button class="btn bad block" id="del" style="margin-top:10px">🗑 Убрать</button>' : ''}</div>`;
  $('#up', el).onclick = () => $('#file', el).click();
  $('#file', el).onchange = async e => { const f = e.target.files[0]; if (!f) return; const fd = new FormData(); fd.append('file', f); try { await api('/api/admin/photo_set', fd); toast('Сохранено ✅', 'good'); go('admin_pic', {}, { replace: true }); } catch (er) { fail(er); } };
  const d = $('#del', el); if (d) d.onclick = async () => { await api('/api/admin/photo_del', {}); toast('Убрано', 'good'); go('admin_pic', {}, { replace: true }); };
};

views.admin_status = async el => {
  const o = await api('/api/admin/overview');
  el.innerHTML = `<h2 class="page">ℹ️ Статус</h2><div class="card glass stagger">
    ${[['Группа модерации', o.mod_chat ? o.mod_chat + (o.mod_ok ? ' ✅' : ' ⚠️ бот не видит группу — заявки идут в личку') : 'не задана — заявки приходят в личку главным админам (/setmod в группе)'], ['Чат публикации', o.pub_chat || 'не задан (необязательно)'], ['Непривязанных тем', o.unbound], ['Объявлений в каталоге', o.posts], ['Заявок в очереди', o.pending_requests], ['Анкет в очереди', o.pending_apps], ['Gemini', o.gemini ? o.models.join(', ') : 'ключ не задан'], ['Премиум-эмодзи', 'Встроенные стили бота']].map(([k, v]) => `<div class="kv"><span>${k}</span><span>${esc(v)}</span></div>`).join('')}</div>`;
};

views.admin_stats = async el => {
  const d=await api('/api/admin/stats');
  const rows=[['Пользователей',d.users],['Активных за 7 дней',d.active7],['Активных объявлений',d.active_posts],['Истекших объявлений',d.expired_posts],['Новых жалоб',d.new_reports],['Сохранений в избранное',d.favorites],['Действий за 7 дней',d.activity7]];
  el.innerHTML=`<h2 class="page">Статистика</h2><div class="card glass">${rows.map(([k,v])=>`<div class="kv"><span>${k}</span><b>${v}</b></div>`).join('')}</div>`;
};
views.admin_reports = async el => {
  const d=await api('/api/admin/reports');
  el.innerHTML=`<h2 class="page">Жалобы</h2>`;
  if(!d.reports.length){el.innerHTML+=empty('✓','Новых жалоб нет');return}
  el.innerHTML+=d.reports.map(r=>`<div class="card glass" data-id="${r.id}"><b>Жалоба #${r.id} · объявление #${r.post_id}</b><div class="post-meta">От ${r.reporter} · ${esc(r.created)} · ${esc(r.topic)}</div><p>${esc(r.reason)}</p><div class="rich">${safe(r.text)}</div><button class="btn ok small done">Закрыть жалобу</button></div>`).join('');
  $$('[data-id]',el).forEach(c=>$('.done',c).onclick=async()=>{try{await api('/api/admin/report_done',{id:+c.dataset.id});c.remove();toast('Жалоба закрыта','good')}catch(e){fail(e)}});
};
views.admin_broadcast = async el => {
  el.innerHTML=`<h2 class="page">Рассылка</h2><p class="sub">Сообщение будет отправлено всем пользователям, которые запускали бота или открывали мини-приложение. Используйте Telegram HTML.</p><div class="card glass"><textarea class="f" id="broadcastText" maxlength="4000" placeholder="Текст рассылки…"></textarea><button class="btn block" id="sendBroadcast" style="margin-top:10px">Отправить всем</button></div>`;
  $('#sendBroadcast',el).onclick=async e=>{const text=$('#broadcastText',el).value.trim();if(!text)return toast('Введите текст','err');if(!await confirmBox('Отправить это сообщение всем пользователям?'))return;const btn=e.currentTarget;btn.disabled=true;try{const r=await api('/api/admin/broadcast',{text});toast(`Рассылка запущена: ${r.total} получателей. Итог придёт вам в чат с ботом.`,'good');setTimeout(()=>{btn.disabled=false},4000)}catch(er){fail(er);btn.disabled=false}};
};

/* ============================================================ boot */
$$('#nav .e').forEach(e => e.innerHTML = ic(e.dataset.i, e.dataset.i !== 'plus' && e.dataset.i !== 'heart' ? true : false));
$('#logoAv').src = IMG.av;
(async function boot() {
  if (!tg || !tg.initData) { $('#main').innerHTML = `<div class="view">${empty('🔒', 'Откройте мини-апп из Telegram')}</div>`; return; }
  try { await loadMe(); } catch (e) { $('#main').innerHTML = `<div class="view">${empty('😵', ERR[e.code] || 'Не удалось подключиться')}</div>`; return; }
  go('home', {}, { root: true });
})();
</script>
</body>
</html>
