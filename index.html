  if (!a) { el.innerHTML = empty('🌌', 'Объявление не найдено'); return; }
  const fav = await favSet();
  el.innerHTML = `${adDetail(a)}
    <div class="ad-acts">
      ${a.author_id && !a.mine ? '<button class="btn grow talk">✉️ Написать в мини-приложении</button>' : ''}
      ${a.author_url && !a.mine ? '<button class="btn ghost small telegram-talk">Telegram</button>' : ''}
      <button class="btn ghost fav">${fav.has(a.id) ? '★ В избранном' : '☆ В избранное'}</button>
    </div>
    <div class="ad-acts">
      ${a.author_id && !a.mine ? '<button class="btn ghost small seller-btn">★ Отзывы об авторе</button><button class="btn small direct-deal">🤝 Сделка напрямую</button>' : ''}
      <button class="btn ghost small share">📤 Поделиться</button><button class="btn ghost small copylink">🔗 Ссылка</button>
      ${a.mine ? '' : '<button class="btn ghost small report">🚩 Пожаловаться</button>'}
      ${a.mine ? '<button class="btn ok small bump">Продлить</button><button class="btn bad small mydel">Удалить</button>' : ''}
      ${isStaff() ? '<button class="btn bad small del">Удалить</button>' : ''}
    </div>
    ${a.expires ? `<div class="post-meta">Действует до ${esc(a.expires)}${a.mine && a.days_left !== null && a.days_left <= 3 ? ' · скоро истечёт, нажмите «Продлить»' : ''}</div>` : ''}`;
  galInit(el, (a.photos && a.photos.length) ? a.photos : (a.photo ? [a.photo] : []));
  $('.share', el).onclick = () => shareAd(a); $('.copylink', el).onclick = () => copyAdLink(a);
  const talk=$('.talk',el); if(talk) talk.onclick=()=>go('chat',{peer:a.author_id,post_id:a.id});
  const tgTalk=$('.telegram-talk',el); if(tgTalk) tgTalk.onclick=()=>openLink(a.author_url || a.contact);
  avFill(el);
  const sel = $('.seller', el); if (sel && a.author_id) sel.onclick = () => go('profile', { id: a.author_id });
  const sb = $('.seller-btn', el); if (sb) sb.onclick = () => go('profile', { id: a.author_id });
  const directBtn=$('.direct-deal',el); if(directBtn) directBtn.onclick=()=>go('direct_deals',{seller_id:a.author_id,post_id:a.id});
  $('.fav', el).onclick = async e => { try { const s = await toggleFav(a.id); e.target.textContent = s ? '★ В избранном' : '☆ В избранное'; } catch (er) { fail(er); } };
  const rp = $('.report', el); if (rp) rp.onclick = () => { const rows = [{ t: 'Пожаловаться на объявление', fn: () => reportPost(a) }]; if (a.author_id) rows.push({ t: 'Пожаловаться на автора', fn: () => reportUser(a.author_id, a.author, a.id) }); sheet('Жалоба', rows); };
  const bp = $('.bump', el); if (bp) bp.onclick = async () => { try { await api('/api/bump', { post_id: a.id }); toast('Объявление поднято ещё на 30 дней', 'good'); } catch (e) { fail(e); } };
  const md = $('.mydel', el); if (md) md.onclick = () => deleteOwnAd(a.id, () => { S.ads.delete(a.id); back(); });
  const d = $('.del', el); if (d) d.onclick = async () => { if (!await confirmBox('Удалить объявление?')) return; try { { const r = await api('/api/admin/post_del', { id: a.id }); toast(r.group === 'failed' ? 'Из ленты удалено, из группы — нет: проверьте права бота (Статус)' : 'Удалено', r.group === 'failed' ? 'err' : 'good'); } S.ads.delete(a.id); back(); } catch (e) { fail(e); } };
  api('/api/view', { post_id: a.id }).then(r => { const c = $('#viewsChip', el); if (c && r && r.views !== undefined) { c.textContent = '👁 ' + r.views; a.views = r.views; } }).catch(() => {});
};

views.browse = async el => {
  if (S.me.missing.length) return views.gate(el);
  await loadMe();
  const rows = S.me.topics.filter(t => t.count > 0), total = rows.reduce((a, t) => a + t.count, 0);
  if (!rows.length) { el.innerHTML = empty('🌌', S.me.texts.no_posts.replace(/<[^>]+>/g, '')); return; }
  el.innerHTML = `<h2 class="page">📋 Категории</h2><p class="sub">Выберите категорию, чтобы посмотреть объявления.</p>
    <div class="chips stagger"><span class="chip sel" data-go="feed_browse" data-p='{"topic":0,"name":"Все объявления"}'>🎲 Все <span class="n">${total}</span></span>
    ${rows.map(t => `<span class="chip" data-go="feed_browse" data-p='${esc(JSON.stringify({ topic: t.id, name: t.name }))}'>${esc(t.name)} <span class="n">${t.count}</span></span>`).join('')}</div>`;
};

views.feed_browse = async (el, p) => {
  let offset = 0;
  const load = async () => { const d = await api(`/api/posts?topic=${p.topic}&offset=${offset}&limit=20`); offset += d.posts.length; return d; };
  const d = await load();
  el.innerHTML = `<h2 class="page">📋 ${esc(p.name)}</h2><div id="gb"></div>`;
  await Grid($('#gb', el), { items: d.posts, hasMore: d.has_more, more: load, empty: 'Пока пусто' });
};

views.search = async (el, p) => {
  if (S.me.missing.length) return views.gate(el);
  el.innerHTML = `<h2 class="page">🔍 Поиск <span class="grad">с ИИ</span></h2><p class="sub">${S.me.gemini ? 'ИИ прочитает все объявления и выберет подходящие по смыслу.' : 'Ключ Gemini не задан — работает простой поиск по словам.'}</p>
    <div class="row"><input class="f grow" id="q" maxlength="300" placeholder="Например: взаимный пиар, монтажёр, набор в админы" value="${esc(p.q || '')}"><button class="btn" id="go">Найти</button></div><div id="saved" style="margin-top:12px"></div><div id="res" style="margin-top:16px"></div>`;
  const q = $('#q', el), res = $('#res', el), btn = $('#go', el);
  async function drawSaved() {
    const bx = $('#saved', el); if (!bx) return;
    try {
      const d = await api('/api/searches');
      bx.innerHTML = d.searches.length ? `<div class="grp" style="margin:0 2px 8px">Сохранённые поиски · 🔔 уведомим о новых</div><div class="chips">${d.searches.map(s => `<span class="svq" data-q="${esc(s.query)}" data-id="${s.id}">${esc(s.query)}<u data-del="${s.id}">✕</u></span>`).join('')}</div>` : '';
      $$('.svq', bx).forEach(x => x.onclick = async e => {
        const del = e.target.closest('[data-del]');
        if (del) { e.stopPropagation(); try { await api('/api/searches/del', { id: +del.dataset.del }); drawSaved(); } catch (er) { fail(er); } return; }
        q.value = x.dataset.q; run();
      });
    } catch (e) {}
  }
  drawSaved();
  async function run() {
    const v = q.value.trim(); if (!v) { q.classList.add('shake'); setTimeout(() => q.classList.remove('shake'), 450); return; }
    btn.disabled = true; res.innerHTML = loader() + '<p class="sub" style="text-align:center">ИИ думает…</p>';
    try {
      const d = await api('/api/search', { query: v });
      res.innerHTML = '<div style="margin-bottom:10px"><button class="btn ghost small" id="saveQ">🔔 Сохранить поиск</button></div><div id="gres"></div>';
      $('#saveQ', res).onclick = async () => { try { await api('/api/searches', { query: v }); toast('Поиск сохранён — пришлём уведомление о новых объявлениях', 'good'); drawSaved(); } catch (er) { fail(er); } };
      await Grid($('#gres', res), { items: d.posts, hasMore: false, emptyIc: '😔', empty: d.mode === 'empty' ? 'В каталоге пока нет объявлений' : 'Ничего подходящего не нашлось. Попробуйте переформулировать.', note: d.mode === 'kw' && d.posts.length ? 'ИИ сейчас перегружен — показан простой поиск по словам.' : '' });
    } catch (e) { res.innerHTML = ''; fail(e); }
    btn.disabled = false;
  }
  btn.onclick = run; q.onkeydown = e => { if (e.key === 'Enter') run(); };
  if (p.q) run();
};

  const dealCard=(m,mine,tm)=>{

    else if(d.status==='in_progress'){bt=(myConf?'<button disabled>✓ Вы подтвердили</button>':'<button class="pri" data-da="confirm">Подтвердить выполнение</button>')+'<button class="bad" data-da="cancel">Отменить</button>';pr=`Покупатель ${d.bc?'✓':'…'} · Продавец ${d.sc?'✓':'…'} — для завершения нужны обе стороны`;}

      const u=$('#cvUnblock',el);if(u)u.onclick=async()=>{try{await api('/api/block',{user_id:peer,block:false});apply(await api('/api/messages?'+qs),true);}catch(e){fail(e)}};}
    draw(n.messages,force);
  };
  apply(d,true);refreshUnread();

    const da=e.target.closest('[data-da]');
    if(da){const act=da.dataset.da,id=Number(da.closest('[data-deal]').dataset.deal);
      if((act==='cancel'||act==='decline')&&!await confirmBox(act==='cancel'?'Отменить сделку?':'Отклонить предложение?'))return;
      da.disabled=true;try{await api('/api/direct/action',{deal_id:id,action:act});toast('Готово','good');apply(await api('/api/messages?'+qs),true);}catch(er){fail(er);da.disabled=false;}return;}
    const im=e.target.closest('.cv-img');if(im){const all=$$('.cv-img',log).map(x=>x.dataset.u);return openViewer(all,Math.max(0,all.indexOf(im.dataset.u)));}const f=e.target.closest('.cv-file');if(f)openLink(location.origin+f.dataset.u);};
  avFill(el);
  $('#peerProfile',el).onclick=()=>go('profile',{id:peer});
  $('#cvBack',el).onclick=()=>back();
  $('#cvMore',el).onclick=()=>{const bm=!!st.blocked_by_me;sheet(pname,[{t:'Профиль',fn:()=>go('profile',{id:peer})},{t:'Пожаловаться на пользователя',fn:()=>reportUser(peer,pname,post_id)},{t:bm?'Разблокировать':'Заблокировать',cls:bm?'':'bad',fn:async()=>{if(!bm&&!await confirmBox('Заблокировать пользователя? Он не сможет писать вам и предлагать сделки.'))return;try{await api('/api/block',{user_id:peer,block:!bm});toast(bm?'Разблокирован':'Пользователь заблокирован','good');apply(await api('/api/messages?'+qs),true);}catch(e){fail(e)}}}]);};
  const escrowBtn=$('#startEscrow',el);if(escrowBtn)escrowBtn.onclick=()=>go('escrow',{seller_id:peer,post_id,terms:'Сделка по объявлению #'+post_id+'\nУсловия согласовать в чате.'});

  const send=async file=>{const t=ta.value.trim();if((!t&&!file)||sendBtn.dataset.busy)return false;sendBtn.dataset.busy=1;try{

views.submit = async el => {
  if (S.me.missing.length) return views.gate(el);
  const STEPS = ['Название и фото', 'Тема', 'Условия', 'Описание', 'Предпросмотр'];
  const D = { photos: [], title: '', topic: null, topicName: '', price: '', deal: true, desc: '' };

  el.innerHTML = `<h2 class="page">Подать объявление</h2><div id="stp"></div><div id="body"></div>`;
  const body = $('#body', el), stp = $('#stp', el);
  const priceLine = () => D.deal ? 'договорная' : `${+D.price || 0} ⭐`;
  const compose = () => `${D.title.trim()}\nЦена: ${priceLine()}\n\n${D.desc.trim()}`;
  const fake = () => ({ id: 0, text: compose(), photo: D.photos[0] ? D.photos[0].thumb : null, photos: D.photos.map(x => x.thumb), topic: D.topicName, created: 'сейчас', author: (S.me.user && S.me.user.name) || 'вы' });
  const bad = (node, msg) => { toast(msg, 'err'); if (node) { node.classList.add('shake'); setTimeout(() => node.classList.remove('shake'), 450); } };
  const nav = (next) => `<div class="wz-nav">${step ? '<button class="btn ghost" id="bk">← Назад</button>' : ''}<button class="btn" id="nx">${next}</button></div>`;
  const go2 = n => { step = n; $('#main').scrollTop = 0; draw(); buzz('light'); };

  function draw() {
    stp.innerHTML = `<div class="stp-bar">${STEPS.map((s, i) => `<i class="${i < step ? 'done' : i === step ? 'cur' : ''}"></i>`).join('')}</div><div class="stp-l">Шаг ${step + 1} из ${STEPS.length} · <b>${STEPS[step]}</b></div>`;
    ([s0, s1, s2, s3, s4][step])();
  }
  body.addEventListener('click', e => { if (e.target.closest('#bk')) go2(step - 1); });

  function s0() {
    body.innerHTML = `<input type="file" id="ph" accept="image/*" multiple hidden>
      <div class="ph-grid">${D.photos.map((x, i) => `<div class="ph-t"><img src="${x.thumb}" alt=""><button type="button" class="ph-x" data-i="${i}" aria-label="Убрать">✕</button>${i === 0 ? '<span class="ph-m">Главное</span>' : ''}</div>`).join('')}${D.photos.length < 5 ? `<div class="ph-add" id="phAdd">${ic('plus', false)}<small>${D.photos.length ? 'Ещё фото' : 'Добавить фото'}</small></div>` : ''}</div>
      <div class="ph-hint">До 5 фото. Необязательно, но с фото смотрят чаще</div>

      ${nav('Далее →')}`;

    $$('.ph-x', body).forEach(b => b.onclick = () => { const x = D.photos.splice(+b.dataset.i, 1)[0]; if (x) URL.revokeObjectURL(x.thumb); s0(); });
    ph.onchange = async () => {
      const files = [...(ph.files || [])].slice(0, 5 - D.photos.length); if (!files.length) return;
      try { for (const f of files) { const b = await shrinkImage(f); D.photos.push({ blob: b, thumb: URL.createObjectURL(b) }); } s0(); }

      <div class="chips" style="margin-top:12px">${[10, 50, 100, 500, 1000].map(n => `<span class="chip" data-v="${n}">${fmtN(n)}${STAR}</span>`).join('')}<span class="chip ${D.price === '0' && !D.deal ? 'sel' : ''}" data-v="0">Бесплатно / взаимно</span><span class="chip ${D.deal ? 'sel' : ''}" data-v="deal">Договорная</span></div>

  }

  function s3() {

  function s4() {

async function showTour() {
  if ($('.sp')) return;
  if (S.me && S.me.missing && S.me.missing.length) return;
  let i = 0, dir = 1, alive = true, key = '', token = 0;
  const root = document.createElement('div'); root.className = 'sp nohole';
  root.innerHTML = '<div class="sp-mask"></div><div class="sp-hole"></div><svg class="sp-arrow" aria-hidden="true"><path class="sp-line"/><path class="sp-head"/></svg><div class="sp-card" role="dialog" aria-label="Обучение"></div>';
  document.body.appendChild(root);
  const hole = $('.sp-hole', root), card = $('.sp-card', root), svg = $('.sp-arrow', root), line = $('.sp-line', root), head = $('.sp-head', root);
  let tgt = null;
  const close = async (finish) => {
    if (!alive) return; alive = false; tourMark(); root.classList.add('out');
    setTimeout(() => root.remove(), 280);
    if (S.cur !== 'home' || S.hist.length) { try { await go('home', {}, { root: true }); } catch (e) {} }
  };
  const waitFor = async sel => {
    const t0 = Date.now();
    while (Date.now() - t0 < 4500 && alive) {
      const n = document.querySelector(sel);
      if (n) { const r = n.getBoundingClientRect(); if (r.width > 0 && r.height > 0) return n; }
      await sleep(120);
    }
    return null;
  };
  function layout() {
    if (!alive) return;
    const vw = innerWidth, vh = innerHeight, cw = Math.min(vw - 24, 420);
    card.style.width = cw + 'px'; card.style.left = (vw - cw) / 2 + 'px';
    card.style.maxHeight = '';
    let ch = card.offsetHeight;
    if (!tgt || !tgt.isConnected) {
      root.classList.add('nohole'); svg.style.opacity = 0;
      card.style.top = Math.max(12, (vh - ch) / 2) + 'px'; return;
    }
    const r0 = tgt.getBoundingClientRect(), pad = 7;
    const r = { l: r0.left - pad, t: r0.top - pad, w: r0.width + pad * 2, h: r0.height + pad * 2 };
    r.r = r.l + r.w; r.b = r.t + r.h;
    root.classList.remove('nohole');
    Object.assign(hole.style, { left: r.l + 'px', top: r.t + 'px', width: r.w + 'px', height: r.h + 'px' });
    const cy = r.t + r.h / 2, gap = 64, safe = 12;
    const spaceAbove = r.t - safe, spaceBelow = vh - r.b - safe;
    // targetBelow=true: карточка выше цели. Предпочтение — по половине экрана, но берём сторону, где хватает места
    const fitA = spaceAbove >= ch + gap, fitB = spaceBelow >= ch + gap;
    let targetBelow = cy >= vh * 0.5;
    if (targetBelow ? !fitA : !fitB) targetBelow = fitA || fitB ? fitA : spaceAbove >= spaceBelow;
    const room = (targetBelow ? spaceAbove : spaceBelow) - gap;
    if (ch > room) { ch = Math.max(170, room); card.style.maxHeight = ch + 'px'; }
    let top = targetBelow ? r.t - gap - ch : r.b + gap;
    top = Math.min(Math.max(top, safe), vh - ch - safe);
    card.style.top = top + 'px';
    const cl = (vw - cw) / 2, cr = cl + cw, cardTop = top, cardBot = top + ch;
    // стрелка: от края карточки к краю подсвеченного элемента
    const tx = Math.min(Math.max(r.l + r.w / 2, 18), vw - 18);
    let sx, sy, ex, ey;
    if (!targetBelow && cardTop >= r.b + 24) { sx = Math.min(Math.max(tx, cl + 36), cr - 36); sy = cardTop - 4; ex = tx; ey = r.b + 8; }
    else if (targetBelow && cardBot <= r.t - 24) { sx = Math.min(Math.max(tx, cl + 36), cr - 36); sy = cardBot + 4; ex = tx; ey = r.t - 8; }
    else { svg.style.opacity = 0; return; }
    const mx = (sx + ex) / 2 + (ex >= sx ? -1 : 1) * 38, my = (sy + ey) / 2;
    line.setAttribute('d', `M${sx} ${sy} Q${mx} ${my} ${ex} ${ey}`);
    const ang = Math.atan2(ey - my, ex - mx) * 180 / Math.PI;
    head.setAttribute('d', 'M0 0 L-15 -8 L-15 8 Z'); head.setAttribute('transform', `translate(${ex} ${ey}) rotate(${ang})`);
    svg.setAttribute('width', vw); svg.setAttribute('height', vh); svg.style.opacity = 1;
    const len = line.getTotalLength ? line.getTotalLength() : 200;
    line.style.setProperty('--len', len);
  }
  // следим за положением цели (прокрутка, анимации страницы)
  (function watch() {
    if (!alive) return;
    let k = '';
    if (tgt && tgt.isConnected) { const r = tgt.getBoundingClientRect(); k = [r.left, r.top, r.width, r.height, innerWidth, innerHeight].map(x => Math.round(x)).join(','); }
    if (k !== key) { key = k; layout(); }
    requestAnimationFrame(watch);
  })();
  async function show(n, d) {
    const my = ++token; i = n; dir = d;
    if (i >= TOUR.length) return close(true);
    if (i < 0) { i = 0; }
    const x = TOUR[i];
    let params = {}, skip = false;
    if (x.needAd) { const a = firstAd(); if (!a) skip = true; else params = { id: a.id }; }
    if (skip) return show(i + d, d);
    // экран
    if (x.v) {
      const same = S.cur === x.v && (x.v !== 'ad' || (S.curParams && S.curParams.id === params.id));
      if (!same) {
        root.classList.add('nohole'); svg.style.opacity = 0; tgt = null; layout();
        await go(x.v, params, x.v === 'ad' ? {} : { root: true });
        if (my !== token || !alive) return;
        await sleep(280);
      }
    }
    let n2 = null;
    if (x.target) {
      n2 = await waitFor(x.target); if (my !== token || !alive) return;
      if (!n2 && x.opt) return show(i + d, d);
      if (n2 && !n2.closest('#nav')) { n2.scrollIntoView({ block: 'center', behavior: 'smooth' }); await sleep(380); if (my !== token || !alive) return; }
    }
    tgt = n2; key = '';
    const last = i === TOUR.length - 1;
    card.classList.remove('in'); void card.offsetWidth;
    card.innerHTML = `${last ? '' : '<button class="sp-skip" data-a="skip">Пропустить</button>'}
      <div class="sp-step">Шаг ${i + 1} из ${TOUR.length}</div><h3>${esc(x.t)}</h3><p>${esc(x.p)}</p>
      ${x.li ? `<ul>${x.li.map(([a, b]) => `<li><i>${a}</i><span>${esc(b)}</span></li>`).join('')}</ul>` : ''}
      <div class="sp-bar"><i style="width:${Math.round((i + 1) / TOUR.length * 100)}%"></i></div>
      <div class="sp-btns">${i ? '<button class="btn ghost" data-a="prev">Назад</button>' : ''}<button class="btn" data-a="next">${last ? 'Начать' : 'Далее'}</button></div>`;
    card.classList.add('in');
    line.style.animation = 'none'; head.style.animation = 'none'; void line.getBoundingClientRect(); line.style.animation = ''; head.style.animation = '';
    layout(); buzz('light');
  }
  root.onclick = e => {
    const a = e.target.closest('[data-a]'); if (!a) return;
    if (a.dataset.a === 'skip') close(); else if (a.dataset.a === 'prev') show(i - 1, -1); else show(i + 1, 1);
  };
  addEventListener('resize', layout);
  show(0, 1);
}

  const savedTheme=localStorage.getItem('kmbp-theme') || S.me.theme || 'dark'; setTheme(savedTheme); document.documentElement.style.setProperty('--acc',S.me.accent||'#7c6cff');
  setUnread(S.me.unread); setInterval(() => { if (!document.hidden) refreshUnread(); }, 15000);
  await go('home', {}, { root: true });
  const qp = new URLSearchParams(location.search), sp = (tg.initDataUnsafe && tg.initDataUnsafe.start_param) || '';
  const adId = +(qp.get('ad') || (sp.match(/^ad_(\d+)$/) || [])[1] || 0), chatId = +(qp.get('chat') || 0);
