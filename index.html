<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#000000">
<title>Лесная биржа</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --bg:#000; --glass:rgba(255,255,255,.055); --glass2:rgba(255,255,255,.09);
  --line:rgba(255,255,255,.11); --txt:#f4f4fb; --dim:#9a9ab4;
  --a1:#8b5cf6; --a2:#22d3ee; --a3:#f472b6; --ok:#34d399; --bad:#fb7185; --warn:#fbbf24;
  --r:20px; --ease:cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#000;color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,sans-serif;overflow:hidden}
body{overscroll-behavior:none}
button,input,textarea{font:inherit;color:inherit}
#stars{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.nebula{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.nebula i{position:absolute;border-radius:50%;filter:blur(70px);opacity:.28;animation:drift 22s ease-in-out infinite alternate}
.nebula i:nth-child(1){width:60vmax;height:60vmax;left:-25vmax;top:-20vmax;background:radial-gradient(circle,#5b21b6,transparent 65%)}
.nebula i:nth-child(2){width:55vmax;height:55vmax;right:-25vmax;top:30vh;background:radial-gradient(circle,#0e7490,transparent 65%);animation-duration:28s;animation-delay:-8s}
.nebula i:nth-child(3){width:45vmax;height:45vmax;left:10vw;bottom:-25vmax;background:radial-gradient(circle,#9d174d,transparent 65%);animation-duration:34s;animation-delay:-14s;opacity:.2}
@keyframes drift{from{transform:translate(0,0) scale(1)}to{transform:translate(6vmax,-5vmax) scale(1.15)}}

#app{position:relative;z-index:1;height:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column}
header.top{padding:calc(14px + env(safe-area-inset-top)) 18px 6px;display:flex;align-items:center;gap:10px}
.logo{font-weight:800;font-size:19px;letter-spacing:.3px;background:linear-gradient(90deg,#fff,#c4b5fd,#67e8f9,#f9a8d4,#fff);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 7s linear infinite}
@keyframes shine{to{background-position:-300% 0}}
.logo-dot{width:9px;height:9px;border-radius:50%;background:var(--a2);box-shadow:0 0 14px var(--a2),0 0 28px var(--a1);animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.5);opacity:.6}}
.back{margin-left:auto;display:none}
#main{flex:1;overflow-y:auto;overflow-x:hidden;padding:8px 16px 120px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
#main::-webkit-scrollbar{display:none}
.view{animation:viewIn .55s var(--ease) both}
.view.leave{animation:viewOut .18s ease-in both}
@keyframes viewIn{from{opacity:0;transform:translateY(22px) scale(.985);filter:blur(8px)}to{opacity:1;transform:none;filter:none}}
@keyframes viewOut{to{opacity:0;transform:translateY(-8px);filter:blur(4px)}}
.stagger>*{opacity:0;animation:rise .6s var(--ease) both;animation-delay:calc(var(--i,0)*70ms + 60ms)}
@keyframes rise{from{opacity:0;transform:translateY(24px) scale(.96)}to{opacity:1;transform:none}}

h2.page{margin:6px 2px 14px;font-size:24px;font-weight:800;letter-spacing:.2px}
.sub{color:var(--dim);font-size:14px;margin:-8px 2px 14px;line-height:1.4}
.grad{background:linear-gradient(90deg,var(--a1),var(--a2),var(--a3));-webkit-background-clip:text;background-clip:text;color:transparent}
.glass{background:var(--glass);border:1px solid var(--line);border-radius:var(--r);backdrop-filter:blur(18px) saturate(140%);-webkit-backdrop-filter:blur(18px) saturate(140%);box-shadow:0 10px 40px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.06)}
.card{padding:16px;margin-bottom:12px}
.hello{font-size:26px;font-weight:800;margin:6px 2px 14px}
.rich{white-space:pre-wrap;word-break:break-word;line-height:1.5;font-size:15px}
.rich a{color:var(--a2)} .rich code{background:rgba(255,255,255,.1);padding:1px 5px;border-radius:6px}
.rich blockquote{margin:6px 0;padding-left:10px;border-left:3px solid var(--a1);color:#d6d6ea}
.welcome-img{width:100%;border-radius:14px;margin-bottom:12px;display:block;max-height:240px;object-fit:cover;animation:rise .8s var(--ease) both}

.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{position:relative;padding:16px 14px;min-height:112px;text-align:left;cursor:pointer;border:1px solid var(--line);border-radius:var(--r);background:var(--glass);overflow:hidden;transition:transform .25s var(--ease),border-color .25s;transform-style:preserve-3d;will-change:transform}
.tile::before{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;background:radial-gradient(180px circle at var(--mx,50%) var(--my,0%),rgba(139,92,246,.35),transparent 60%);opacity:0;transition:opacity .3s}
.tile:hover::before,.tile:active::before{opacity:1}
.tile::after{content:"";position:absolute;inset:-60% -20%;background:conic-gradient(from 0deg,transparent 0 70%,rgba(34,211,238,.28) 85%,transparent 100%);animation:spin 7s linear infinite;opacity:.55;z-index:-1}
.tile>*{position:relative;z-index:1}
.tile .in{position:absolute;inset:1px;border-radius:calc(var(--r) - 1px);background:#07070d;z-index:0}
@keyframes spin{to{transform:rotate(360deg)}}
.tile .ic{font-size:30px;display:block;margin-bottom:8px;animation:float 4s ease-in-out infinite}
.tile:nth-child(2n) .ic{animation-delay:-1.5s}.tile:nth-child(3n) .ic{animation-delay:-2.7s}
@keyframes float{50%{transform:translateY(-6px) rotate(-4deg)}}
.tile b{display:block;font-size:15px;margin-bottom:3px}
.tile small{color:var(--dim);font-size:12px;line-height:1.3;display:block}
.tile.wide{grid-column:1/-1;min-height:0}
.badge{position:absolute;top:10px;right:10px;z-index:2;background:linear-gradient(135deg,var(--a3),var(--a1));color:#fff;border-radius:99px;font-size:11px;font-weight:700;padding:2px 8px;animation:pulse 2s infinite}

.btn{position:relative;overflow:hidden;border:0;cursor:pointer;padding:13px 20px;border-radius:14px;font-weight:700;font-size:15px;color:#fff;background:linear-gradient(135deg,var(--a1),#6366f1 45%,var(--a2));background-size:200% 200%;animation:gradmove 6s ease infinite;box-shadow:0 8px 28px rgba(99,102,241,.4);transition:transform .2s var(--ease),box-shadow .2s,opacity .2s}
.btn:active{transform:scale(.95)}
.btn:disabled{opacity:.45;pointer-events:none}
.btn.ghost{background:var(--glass2);box-shadow:none;border:1px solid var(--line);animation:none}
.btn.ok{background:linear-gradient(135deg,#059669,var(--ok));box-shadow:0 8px 24px rgba(52,211,153,.3)}
.btn.bad{background:linear-gradient(135deg,#be123c,var(--bad));box-shadow:0 8px 24px rgba(251,113,133,.3)}
.btn.small{padding:8px 13px;font-size:13px;border-radius:11px}
.btn.block{display:block;width:100%}
@keyframes gradmove{50%{background-position:100% 50%}}
.ripple{position:absolute;border-radius:50%;background:rgba(255,255,255,.45);transform:scale(0);animation:rip .65s ease-out forwards;pointer-events:none}
@keyframes rip{to{transform:scale(4);opacity:0}}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.end{justify-content:flex-end}
.grow{flex:1}

input.f,textarea.f{width:100%;padding:14px 16px;border-radius:14px;background:rgba(255,255,255,.06);border:1px solid var(--line);outline:none;font-size:16px;transition:border-color .25s,box-shadow .25s,background .25s;resize:vertical}
textarea.f{min-height:130px}
input.f:focus,textarea.f:focus{border-color:var(--a1);box-shadow:0 0 0 4px rgba(139,92,246,.2),0 0 30px rgba(34,211,238,.15);background:rgba(255,255,255,.09)}
.lbl{font-size:13px;color:var(--dim);margin:12px 2px 6px;display:block}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:8px 13px;border-radius:99px;background:var(--glass2);border:1px solid var(--line);font-size:13px;cursor:pointer;user-select:none;transition:all .25s var(--ease)}
.chip.dim{color:var(--dim);cursor:default}
.chip.sel{background:linear-gradient(135deg,rgba(139,92,246,.55),rgba(34,211,238,.4));border-color:rgba(255,255,255,.35);transform:scale(1.05);box-shadow:0 0 22px rgba(139,92,246,.5)}
.chip .n{opacity:.6;font-size:12px}
.counter{font-size:12px;color:var(--dim);text-align:right;margin-top:4px}

/* feed */
.feed-head{display:flex;align-items:center;justify-content:space-between;margin:2px 2px 12px}
.feed-title{font-weight:800;font-size:17px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pos{font-size:13px;color:var(--dim);font-variant-numeric:tabular-nums}
.stage{position:relative;min-height:320px;touch-action:pan-y}
.post{padding:18px;animation:cardIn .5s var(--ease) both;will-change:transform}
.post.l{animation-name:cardInL}
@keyframes cardIn{from{opacity:0;transform:translateX(60px) rotate(3deg) scale(.95)}to{opacity:1;transform:none}}
@keyframes cardInL{from{opacity:0;transform:translateX(-60px) rotate(-3deg) scale(.95)}to{opacity:1;transform:none}}
.post .body{margin:14px 0;max-height:46vh;overflow-y:auto;scrollbar-width:none;font-size:16px}
.post .foot{display:flex;align-items:center;gap:8px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:12px}
.author{color:var(--dim);font-size:13px;margin-right:auto}
.feed-nav{display:flex;gap:10px;margin-top:14px}
.feed-nav .btn{flex:1}
.end{text-align:center;padding:34px 20px}
.end .big{font-size:54px;animation:float 3s ease-in-out infinite}
.empty{text-align:center;color:var(--dim);padding:40px 10px}
.empty .big{font-size:48px;margin-bottom:8px}
.note{font-size:13px;color:var(--warn);background:rgba(251,191,36,.08);border:1px solid rgba(251,191,36,.25);border-radius:12px;padding:8px 12px;margin-bottom:10px}

.status{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:700}
.st-pending,.st-awaiting_reason,.st-awaiting_edit{background:rgba(251,191,36,.15);color:var(--warn)}
.st-approved,.st-approved_edited,.st-accepted{background:rgba(52,211,153,.15);color:var(--ok)}
.st-rejected,.st-declined_by_user{background:rgba(251,113,133,.15);color:var(--bad)}
.st-awaiting_user{background:rgba(34,211,238,.15);color:var(--a2)}
.li{display:flex;align-items:center;gap:12px;padding:14px;margin-bottom:10px;cursor:pointer;transition:transform .2s var(--ease)}
.li:active{transform:scale(.97)}
.li .ic{font-size:22px;width:34px;text-align:center}
.li .t{flex:1;min-width:0}.li .t b{display:block}.li .t small{color:var(--dim)}
.li .arr{color:var(--dim);font-size:20px}
.kv{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.kv:last-child{border:0}.kv span:first-child{color:var(--dim)}

/* nav */
nav.bar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom));z-index:10;width:min(92vw,520px);display:flex;padding:6px;border-radius:26px;background:rgba(14,14,22,.72);border:1px solid var(--line);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);box-shadow:0 14px 50px rgba(0,0,0,.7);animation:navIn .8s var(--ease) both .3s}
@keyframes navIn{from{opacity:0;transform:translate(-50%,40px)}}
nav.bar button{flex:1;position:relative;z-index:1;background:none;border:0;padding:9px 0 7px;color:var(--dim);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;transition:color .3s}
nav.bar button .e{font-size:20px;transition:transform .35s var(--ease)}
nav.bar button.on{color:#fff}nav.bar button.on .e{transform:translateY(-3px) scale(1.2)}
#ind{position:absolute;top:6px;bottom:6px;left:6px;width:calc((100% - 12px)/5);border-radius:20px;background:linear-gradient(135deg,rgba(139,92,246,.45),rgba(34,211,238,.3));box-shadow:0 0 26px rgba(139,92,246,.45);transition:transform .45s var(--ease);z-index:0}

/* loader / toast */
.loader{display:flex;justify-content:center;padding:60px 0}
.orb{position:relative;width:54px;height:54px}
.orb i{position:absolute;inset:0;border-radius:50%;border:2px solid transparent;border-top-color:var(--a2);animation:spin 1s linear infinite}
.orb i:nth-child(2){inset:8px;border-top-color:var(--a1);animation-duration:1.5s;animation-direction:reverse}
.orb i:nth-child(3){inset:17px;border-top-color:var(--a3);animation-duration:.8s}
#toast{position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top));transform:translate(-50%,-140%);z-index:50;max-width:88vw;padding:12px 18px;border-radius:16px;background:rgba(20,20,32,.92);border:1px solid var(--line);backdrop-filter:blur(16px);font-size:14px;transition:transform .5s var(--ease);box-shadow:0 10px 40px rgba(0,0,0,.6)}
#toast.show{transform:translate(-50%,0)}#toast.err{border-color:rgba(251,113,133,.6)}#toast.good{border-color:rgba(52,211,153,.6)}
.shake{animation:shake .45s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.sw{position:relative;width:52px;height:30px;border-radius:99px;background:rgba(255,255,255,.12);cursor:pointer;transition:background .3s;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .35s var(--ease)}
.sw.on{background:linear-gradient(135deg,var(--a1),var(--a2));box-shadow:0 0 18px rgba(139,92,246,.6)}.sw.on::after{transform:translateX(22px)}
details.card summary{cursor:pointer;font-weight:700;list-style:none}details.card summary::-webkit-details-marker{display:none}
hr.sep{border:0;border-top:1px solid var(--line);margin:12px 0}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

:root[data-theme="light"]{--bg:#f4f7fb;--glass:rgba(255,255,255,.76);--glass2:rgba(255,255,255,.92);--line:rgba(31,41,55,.13);--txt:#182033;--dim:#68738a;--a1:#5266dc;--a2:#0796ad;--a3:#d45b9a;--ok:#168b62;--bad:#d94b64;--warn:#a66b00}
:root[data-theme="light"] html,:root[data-theme="light"] body{background:#f4f7fb;color:var(--txt)}
:root[data-theme="light"] body{background:radial-gradient(circle at 10% 0%,#e3eaff,#f7f9fc 55%,#e7f6f8)}
:root[data-theme="light"] .nebula{opacity:.16}
:root[data-theme="light"] .tile .in{background:rgba(255,255,255,.72)}
:root[data-theme="light"] nav.bar{background:rgba(255,255,255,.82);box-shadow:0 14px 40px rgba(40,55,80,.15)}
:root[data-theme="light"] nav.bar button.on{color:#24304a}
:root[data-theme="light"] .rich blockquote{color:#48536a}
:root[data-theme="light"] #toast{background:rgba(255,255,255,.96);color:#182033}
.post-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}
.post-actions .btn{flex:1;min-width:112px}
.post-meta{font-size:12px;color:var(--dim);margin-top:8px}
@media(prefers-reduced-motion:no-preference){.post-actions .btn{transition:transform .2s var(--ease),filter .2s}.post-actions .btn:active{transform:scale(.96);filter:brightness(1.1)}}
</style>
</head>
<body>
<canvas id="stars"></canvas>
<div class="nebula"><i></i><i></i><i></i></div>
<div id="toast"></div>
<div id="app">
  <header class="top"><span class="logo-dot"></span><span class="logo">ЛЕСНАЯ БИРЖА</span><button class="btn ghost small back" id="backBtn">← Назад</button></header>
  <main id="main"></main>
  <nav class="bar" id="nav">
    <div id="ind"></div>
    <button data-go="home"><span class="e">🏠</span>Главная</button>
    <button data-go="browse"><span class="e">📋</span>Объявления</button>
    <button data-go="search"><span class="e">🔍</span>Поиск</button>
    <button data-go="recs"><span class="e">⭐</span>Для вас</button>
    <button data-go="more"><span class="e">✨</span>Ещё</button>
  </nav>
</div>

<script>
/* ============================================================ utils */
const tg = window.Telegram && Telegram.WebApp;
const savedTheme = (()=>{try{return localStorage.getItem('forest-theme')||'dark'}catch(e){return 'dark'}})();
document.documentElement.dataset.theme = savedTheme;
try { tg && (tg.ready(), tg.expand(), tg.setHeaderColor && tg.setHeaderColor('#000000'), tg.setBackgroundColor && tg.setBackgroundColor('#000000'), tg.disableVerticalSwipes && tg.disableVerticalSwipes()); } catch (e) {}
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const buzz = (t = 'light') => { try { tg && tg.HapticFeedback && tg.HapticFeedback.impactOccurred(t); } catch (e) {} };

// безопасный рендер Telegram-HTML (tg-emoji → обычный эмодзи-заменитель)
function safe(src) {
  const doc = new DOMParser().parseFromString('<div>' + (src || '') + '</div>', 'text/html');
  const out = document.createElement('div');
  const OK = ['b', 'strong', 'i', 'em', 'u', 's', 'strike', 'del', 'code', 'pre', 'blockquote'];
  (function walk(from, to) {
    from.childNodes.forEach(n => {
      if (n.nodeType === 3) to.appendChild(document.createTextNode(n.textContent));
      else if (n.nodeType === 1) {
        const t = n.tagName.toLowerCase();
        if (t === 'br') to.appendChild(document.createElement('br'));
        else if (OK.includes(t)) { const e = document.createElement(t); walk(n, e); to.appendChild(e); }
        else if (t === 'a') {
          const e = document.createElement('a'); const h = n.getAttribute('href') || '';
          if (/^(https?:\/\/|tg:\/\/)/i.test(h)) { e.href = h; e.target = '_blank'; e.rel = 'noopener'; }
          walk(n, e); to.appendChild(e);
        } else walk(n, to);
      }
    });
  })(doc.body.firstChild, out);
  return out.innerHTML;
}
const plain = src => new DOMParser().parseFromString(safe(src).replace(/<br\s*\/?>/g, '\n'), 'text/html').body.textContent;

const ERR = {
  unauthorized: 'Откройте мини-апп из Telegram', forbidden: 'Нет доступа', slow: 'Не так быстро, подождите пару секунд',
  closed: 'Приём сейчас закрыт', exists: 'Анкета уже на рассмотрении', already_admin: 'Вы уже админ', empty: 'Заполните все поля',
  too_long: 'Слишком длинный текст', stale: 'Это уже неактуально', limit: 'Достигнут лимит', bad_id: 'Неверный ID',
  bad_image: 'Не удалось принять картинку', bad_size: 'Файл пустой или больше 8 МБ', server: 'Ошибка сервера, попробуйте позже',
};
let toastT;
function toast(msg, kind = '') {
  const t = $('#toast'); t.textContent = msg; t.className = 'show ' + kind; clearTimeout(toastT);
  toastT = setTimeout(() => t.className = '', 2800);
  if (kind === 'good') buzz('medium'); if (kind === 'err') { try { tg.HapticFeedback.notificationOccurred('error'); } catch (e) {} }
}
async function api(path, body, method) {
  const opt = { method: method || (body === undefined ? 'GET' : 'POST'), headers: { 'X-Init-Data': (tg && tg.initData) || '' } };
  if (body instanceof FormData) opt.body = body;
  else if (body !== undefined) { opt.headers['Content-Type'] = 'application/json'; opt.body = JSON.stringify(body); }
  let r;
  try { r = await fetch(path, opt); } catch (e) { const er = new Error('network'); er.code = 'network'; throw er; }
  let data = null; try { data = await r.json(); } catch (e) {}
  if (!r.ok) { const er = new Error((data && data.error) || 'http' + r.status); er.code = er.message; er.status = r.status; throw er; }
  return data;
}
const loader = () => '<div class="loader"><div class="orb"><i></i><i></i><i></i></div></div>';
const empty = (ic, t) => `<div class="empty view"><div class="big">${ic}</div>${esc(t)}</div>`;
async function fail(e) {
  if (e.code === 'subscribe') { await loadMe(); return go('gate', {}, { replace: true }); }
  toast(ERR[e.code] || (e.code === 'network' ? 'Нет связи с сервером' : 'Ошибка: ' + e.code), 'err');
}
const confirmBox = msg => new Promise(res => { if (tg && tg.showConfirm) tg.showConfirm(msg, res); else res(confirm(msg)); });
function openLink(u) { if (!u) return; if ((/^https:\/\/t\.me\//.test(u) || /^tg:\/\//.test(u)) && tg && tg.openTelegramLink) tg.openTelegramLink(u); else if (tg && tg.openLink) tg.openLink(u); else window.open(u, '_blank'); }
function setTheme(theme){document.documentElement.dataset.theme=theme;try{localStorage.setItem('forest-theme',theme)}catch(e){};try{tg&&tg.setHeaderColor&&tg.setHeaderColor(theme==='light'?'#f4f7fb':'#000000');tg&&tg.setBackgroundColor&&tg.setBackgroundColor(theme==='light'?'#f4f7fb':'#000000')}catch(e){}}

/* ripple + tilt */
document.addEventListener('pointerdown', e => {
  const el = e.target.closest('.btn,.tile,.li,.chip:not(.dim)'); if (!el) return;
  const r = el.getBoundingClientRect(), s = document.createElement('span'), d = Math.max(r.width, r.height);

  el.appendChild(s); setTimeout(() => s.remove(), 700); buzz('light');
});

/* ============================================================ stars */
const Stars = (() => {
  const c = $('#stars'), x = c.getContext('2d');
  let W, H, DPR, stars = [], shoot = [], parts = [], px = 0, py = 0, tx = 0, ty = 0, last = performance.now(), nextShoot = 1500;
  const COL = ['255,255,255', '196,181,253', '165,243,252', '251,207,232'];
  const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const mk = () => { const z = Math.random(); return { x: Math.random() * W, y: Math.random() * H, z, r: .3 + z * 1.5, vx: -(.012 + z * .05), vy: .004 + z * .02, tw: Math.random() * 6.28, ts: .0008 + Math.random() * .003, col: COL[Math.random() < .65 ? 0 : 1 + (Math.random() * 3 | 0)] }; };
  function resize() { DPR = Math.min(devicePixelRatio || 1, 2); W = innerWidth; H = innerHeight; c.width = W * DPR; c.height = H * DPR; x.setTransform(DPR, 0, 0, DPR, 0, 0); stars = Array.from({ length: Math.min(260, Math.round(W * H / 4800)) }, mk); }
  addEventListener('resize', resize); resize();
  addEventListener('pointermove', e => { tx = (e.clientX / W - .5); ty = (e.clientY / H - .5); });
  addEventListener('deviceorientation', e => { if (e.gamma != null) { tx = Math.max(-.5, Math.min(.5, e.gamma / 60)); ty = Math.max(-.5, Math.min(.5, (e.beta - 45) / 90)); } });
  let sy = 0; document.addEventListener('scroll', e => { if (e.target && e.target.id === 'main') sy = e.target.scrollTop; }, true);
  function spawnShoot() { const sx = Math.random() * W * .9 + W * .1, sp = 7 + Math.random() * 6; shoot.push({ x: sx, y: -20 + Math.random() * H * .3, vx: -sp, vy: sp * .55, life: 1, len: 90 + Math.random() * 90 }); }
  function burst(bx, by, n = 36) { for (let i = 0; i < n; i++) { const a = Math.random() * 6.28, s = 1.5 + Math.random() * 5; parts.push({ x: bx, y: by, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 1.5, life: 1, col: COL[1 + (Math.random() * 3 | 0)], r: 1 + Math.random() * 2.4 }); } }
  function frame(now) {
    const dt = Math.min(now - last, 50); last = now;
    px += (tx - px) * .04; py += (ty - py) * .04;
    x.clearRect(0, 0, W, H);
    for (const s of stars) {
      if (!still) { s.x += s.vx * dt; s.y += s.vy * dt; s.tw += s.ts * dt; }
      if (s.x < -4) s.x = W + 4; if (s.y > H + 4) s.y = -4;
      const ox = px * 40 * s.z, oy = py * 40 * s.z - sy * .06 * s.z;
      let X = s.x + ox, Y = ((s.y + oy) % H + H) % H;
      const a = .3 + .7 * (.5 + .5 * Math.sin(s.tw));
      x.fillStyle = `rgba(${s.col},${a})`; x.beginPath(); x.arc(X, Y, s.r, 0, 6.283); x.fill();
      if (s.z > .82) { x.fillStyle = `rgba(${s.col},${a * .18})`; x.beginPath(); x.arc(X, Y, s.r * 4, 0, 6.283); x.fill(); x.strokeStyle = `rgba(${s.col},${a * .6})`; x.lineWidth = .6; x.beginPath(); x.moveTo(X - s.r * 3.5, Y); x.lineTo(X + s.r * 3.5, Y); x.moveTo(X, Y - s.r * 3.5); x.lineTo(X, Y + s.r * 3.5); x.stroke(); }
    }
    if (!still) { nextShoot -= dt; if (nextShoot <= 0) { spawnShoot(); nextShoot = 2200 + Math.random() * 4500; } }
    for (let i = shoot.length - 1; i >= 0; i--) {
      const s = shoot[i]; s.x += s.vx * dt / 16; s.y += s.vy * dt / 16; s.life -= dt / 1400;
      if (s.life <= 0 || s.x < -200 || s.y > H + 200) { shoot.splice(i, 1); continue; }
      const g = x.createLinearGradient(s.x, s.y, s.x - s.vx * s.len / 8, s.y - s.vy * s.len / 8);
      g.addColorStop(0, `rgba(255,255,255,${s.life})`); g.addColorStop(1, 'rgba(139,92,246,0)');
      x.strokeStyle = g; x.lineWidth = 2; x.lineCap = 'round'; x.beginPath(); x.moveTo(s.x, s.y); x.lineTo(s.x - s.vx * s.len / 8, s.y - s.vy * s.len / 8); x.stroke();
    }
    for (let i = parts.length - 1; i >= 0; i--) {
      const p = parts[i]; p.x += p.vx * dt / 16; p.y += p.vy * dt / 16; p.vy += .08 * dt / 16; p.life -= dt / 900;
      if (p.life <= 0) { parts.splice(i, 1); continue; }
      x.fillStyle = `rgba(${p.col},${p.life})`; x.beginPath(); x.arc(p.x, p.y, p.r, 0, 6.283); x.fill();
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  return { burst };
})();
const celebrate = () => { for (let i = 0; i < 4; i++) setTimeout(() => Stars.burst(innerWidth * (.2 + Math.random() * .6), innerHeight * (.25 + Math.random() * .3), 40), i * 160); buzz('heavy'); };

/* ============================================================ router */
const S = { me: null, hist: [], cur: 'home' };
const views = {};
const TABS = ['home', 'browse', 'search', 'recs', 'more'];
const TAB_OF = { home: 'home', browse: 'browse', feed_browse: 'browse', search: 'search', recs: 'recs', favorites:'more' };
function setInd(name) {
  const i = Math.max(0, TABS.indexOf(TAB_OF[name] || 'more'));
  $('#ind').style.transform = `translateX(${i * 100}%)`;
  $$('#nav button').forEach(b => b.classList.toggle('on', b.dataset.go === (TAB_OF[name] || 'more')));
}
async function go(name, params = {}, opt = {}) {
  const main = $('#main');
  if (!opt.replace && S.cur && !opt.noPush && name !== S.cur) S.hist.push({ name: S.cur, params: S.curParams || {} });
  if (opt.root) S.hist = [];
  S.cur = name; S.curParams = params; setInd(name);
  const old = $('.view', main); if (old) { old.classList.add('leave'); await sleep(150); }
  const v = document.createElement('div'); v.className = 'view'; v.innerHTML = loader(); main.innerHTML = ''; main.appendChild(v); main.scrollTop = 0;
  $('#backBtn').style.display = S.hist.length ? 'inline-block' : 'none';
  try { tg && (S.hist.length ? tg.BackButton.show() : tg.BackButton.hide()); } catch (e) {}
  try { v.innerHTML = ''; await views[name](v, params); stagger(v); } catch (e) { v.innerHTML = ''; await fail(e); }
}
function stagger(el) { $$('.stagger', el).forEach(s => [...s.children].forEach((c, i) => c.style.setProperty('--i', i))); }
function back() { const h = S.hist.pop(); if (h) go(h.name, h.params, { replace: true }); }
$('#backBtn').onclick = back; try { tg && tg.BackButton.onClick(back); } catch (e) {}
$$('#nav button').forEach(b => b.onclick = () => go(b.dataset.go, {}, { root: true }));
document.addEventListener('click', e => { const g = e.target.closest('[data-go]'); if (g && !g.closest('#nav')) go(g.dataset.go, g.dataset.p ? JSON.parse(g.dataset.p) : {}); });

async function loadMe() { S.me = await api('/api/me'); return S.me; }
const isStaff = () => !!S.me.role, isMain = () => ['owner', 'main'].includes(S.me.role);

/* ============================================================ Feed component */
function Feed(el, o) {
  let items = o.items.slice(), more = o.hasMore, idx = 0, busy = false, dragging = false;
  el.innerHTML = `<div class="feed-head"><div class="feed-title">${o.title}</div><div class="pos"></div></div>
    ${o.note ? `<div class="note">${esc(o.note)}</div>` : ''}
    <div class="stage"></div>
    <div class="feed-nav"><button class="btn ghost prev">← Назад</button><button class="btn next">Далее →</button></div>`;
  const stage = $('.stage', el), pos = $('.pos', el);
  async function ensure() { if (more && !busy && idx >= items.length - 3) { busy = true; try { const d = await o.more(); items = items.concat(d.posts); more = d.has_more; } catch (e) { more = false; } busy = false; render(); } }
  function show(dir) {
    stage.innerHTML = '';
    if (idx >= items.length) {
      stage.innerHTML = `<div class="post glass end ${dir < 0 ? 'l' : ''}"><div class="big">🎉</div><p>${esc(S.me.texts.feed_end.replace(/<[^>]+>/g, ''))}</p><button class="btn restart">↺ К началу</button></div>`;
      $('.restart', stage).onclick = () => { idx = 0; show(-1); render(); }; return;
    }
    const p = items[idx];
    const card = document.createElement('article'); card.className = 'post glass' + (dir < 0 ? ' l' : '');
    card.innerHTML = `<div class="chips"><span class="chip dim">📂 ${esc(p.topic)}</span><span class="chip dim">🕒 ${esc(p.created)}</span></div>
      <div class="body rich">${safe(p.text)}</div>
      <div class="foot"><span class="author">Автор: ${esc(p.author)}</span>
      ${p.author_url ? '<button class="btn small contact">Профиль автора</button>' : ''}
      ${isStaff() ? '<button class="btn small bad del">Удалить</button>' : ''}</div>
      <div class="post-actions">
        <button class="btn ghost small fav">☆ В избранное</button>
        <button class="btn ghost small report">Пожаловаться</button>
        ${p.mine ? '<button class="btn ok small bump">Поднять</button>' : ''}
      </div>
      ${p.expires ? `<div class="post-meta">Действует до ${esc(p.expires)}</div>` : ''}`;
    stage.appendChild(card);
    const c = $('.contact', card); if (c) c.onclick = () => openLink(p.author_url || p.contact);
    const f = $('.fav', card); if (f) f.onclick = async () => { try { const r=await api('/api/favorite',{post_id:p.id}); f.textContent=r.saved?'★ В избранном':'☆ В избранное'; f.classList.toggle('ok',r.saved); toast(r.saved?'Добавлено в избранное':'Убрано из избранного','good'); } catch(e){fail(e)} };
    const rp = $('.report', card); if (rp) rp.onclick = async () => { if(!await confirmBox('Отправить жалобу на это объявление?')) return; try{const r=await api('/api/report',{post_id:p.id});toast(r.duplicate?'Вы уже жаловались':'Жалоба отправлена админам','good')}catch(e){fail(e)} };
    const bp = $('.bump', card); if (bp) bp.onclick = async () => { try{await api('/api/bump',{post_id:p.id});toast('Объявление поднято ещё на 30 дней','good');go(S.cur,S.curParams,{replace:true})}catch(e){fail(e)} };
    const d = $('.del', card); if (d) d.onclick = async () => { if (!await confirmBox('Удалить объявление?')) return; await api('/api/admin/post_del', { id: p.id }); items.splice(idx, 1); toast('Удалено', 'good'); show(1); render(); };
    api('/api/view', { post_id: p.id }).catch(() => {});
  }
  function render() { pos.textContent = items.length ? `${Math.min(idx + 1, items.length)} / ${items.length}${more ? '+' : ''}` : ''; $('.prev', el).style.visibility = idx === 0 ? 'hidden' : 'visible'; $('.next', el).disabled = idx >= items.length && !more; }
  function step(d) { const n = idx + d; if (n < 0 || n > items.length) return; idx = n; show(d); render(); ensure(); buzz('light'); }
  $('.next', el).onclick = () => step(1); $('.prev', el).onclick = () => step(-1);
  // свайп
  let sx = 0, sy = 0, dx = 0, lock = null;
  stage.addEventListener('pointerdown', e => { if (e.target.closest('button,a')) return; sx = e.clientX; sy = e.clientY; dx = 0; lock = null; dragging = true; });
  stage.addEventListener('pointermove', e => {
    if (!dragging) return; const c = $('.post', stage); if (!c) return;
    const mx = e.clientX - sx, my = e.clientY - sy;
    if (lock === null && (Math.abs(mx) > 8 || Math.abs(my) > 8)) lock = Math.abs(mx) > Math.abs(my) ? 'x' : 'y';
    if (lock !== 'x') return; dx = mx; c.style.animation = 'none'; c.style.transition = 'none'; c.style.transform = `translateX(${dx}px) rotate(${dx / 25}deg)`; c.style.opacity = 1 - Math.min(Math.abs(dx) / 400, .5);
  });
  const end = () => { if (!dragging) return; dragging = false; const c = $('.post', stage); if (lock === 'x' && c) { if (Math.abs(dx) > 90) { const d = dx < 0 ? 1 : -1; c.style.transition = 'transform .22s,opacity .22s'; c.style.transform = `translateX(${dx < 0 ? -420 : 420}px) rotate(${dx < 0 ? -14 : 14}deg)`; c.style.opacity = 0; setTimeout(() => step(d), 180); } else { c.style.transition = 'transform .3s var(--ease),opacity .3s'; c.style.transform = ''; c.style.opacity = 1; } } };
  stage.addEventListener('pointerup', end); stage.addEventListener('pointercancel', end);
  show(1); render(); ensure();
}
